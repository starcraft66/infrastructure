stages:
- check

check:
  stage: check
  tags:
  - nix
  image: nixpkgs/nix
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
    - flake.nix
    - flake.lock
    - shell.nix
    - nixos/**/*
    - k8s/apps/coredns/**/*
    - k8s/apps/argocd/overlays/*/resources/applications.yaml
  before_script:
  - 'mkdir -p /etc/nix'
  - 'echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf'
  script:
  - 'nix --version'
  - 'nix flake show --all-systems'
  - 'nix flake check --all-systems --no-build --show-trace'
  - 'nix run .#update-coredns-service-addresses'
  - 'git diff --exit-code -- k8s/apps/coredns/overlays/235-prod/resources/service.yaml k8s/apps/coredns/overlays/305-1700-prod/resources/service.yaml'
