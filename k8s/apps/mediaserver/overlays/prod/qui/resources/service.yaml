---
apiVersion: v1
kind: Service
metadata:
  name: qui
  labels:
    app.kubernetes.io/name: qui
spec:
  # qui binds dual-stack from 0.0.0.0 (Go listens on [::]:7476), so expose it
  # dual-stack like the rest of the stack.
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
  - IPv6
  - IPv4
  ports:
  - name: http
    protocol: TCP
    targetPort: http
    port: 80
  selector:
    app.kubernetes.io/name: qui
  type: ClusterIP
