---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyswarrm
  labels:
    app.kubernetes.io/name: jellyswarrm
spec:
  serviceName: "jellyswarrm"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyswarrm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyswarrm
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: jellyswarrm
      containers:
      - name: jellyswarrm
        image: ghcr.io/llukas22/jellyswarrm:0.3.1
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: jellyswarrm-credentials
        env:
        - name: JELLYSWARRM_HOST
          value: "0.0.0.0"
        - name: JELLYSWARRM_PORT
          value: "3000"
        - name: JELLYSWARRM_PUBLIC_ADDRESS
          value: "swarm.mediaserver.tdude.co"
        - name: JELLYSWARRM_SERVER_NAME
          value: "Jellyswarrm"
        # NOTE: upstream servers are added via the /ui admin page after first
        # login. JELLYSWARRM_PRECONFIGURED_SERVERS is intentionally not set
        # here: it is a Vec<PreconfiguredServer> and a malformed env value
        # would fail config deserialization and crash-loop the pod.
        ports:
        - name: "http"
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: jellyswarrm-data
          mountPath: /app/data
        resources:
          requests:
            cpu: "0.25"
            memory: "250Mi"
          limits:
            memory: "500Mi"
        # NOTE: /ready is proxied to the upstream Jellyfin server (which has
        # no such route -> 404), so readiness uses /health instead.
        # Jellyfin answers /health with 200 when reachable.
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      volumes:
      - name: jellyswarrm-data
        persistentVolumeClaim:
          claimName: jellyswarrm-data
