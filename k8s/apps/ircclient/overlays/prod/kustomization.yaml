apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ./resources/volume.yaml
- ./resources/ingress.yaml

namespace: ircclient

configMapGenerator:
- name: thelounge-permissions
  literals: &perms
  - "PUID=1000"
  - "PGID=1000"
  - "TZ=America/Toronto"
- name: znc-permissions
  literals: *perms
- name: thelounge-config
  files:
  - "config.js=./config/thelounge.js"

images:
- name: lscr.io/linuxserver/thelounge
  digest: sha256:80fd08cef14831e6521266d815fd6620900209101d26018dca6c8fa5dd47da14
- name: lscr.io/linuxserver/znc
  digest: sha256:b43447cc6ffc5d96921ea5c4956973898784cea7178d25abcfa671ab8babb896