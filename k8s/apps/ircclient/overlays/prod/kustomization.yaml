apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ./resources/volume.yaml
- ./resources/ingress.yaml

namespace: ircclient

configMapGenerator:
- name: thelounge-permissions
  literals: &perms
  - "PUID=1000"
  - "PGID=1000"
  - "TZ=America/Toronto"
- name: znc-permissions
  literals: *perms
- name: thelounge-config
  files:
  - "config.js=./config/thelounge.js"

images:
- name: lscr.io/linuxserver/thelounge
  digest: sha256:998505e9aeb5cf33d13235515d9318911463b4b8ac64a8ea702cc1f9ae9b5ed7
- name: lscr.io/linuxserver/znc
  digest: sha256:92706506093a4bca7c71450bc9e5ed44de4e605fa068430fd4a786c1acdf10fa