apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/namespace.yaml
- ./resources/postgres.yaml
- ./resources/statefulset.yaml
- ./resources/service.yaml
- ./resources/volume.yaml
- ./resources/pdb.yaml

namespace: immich

helmCharts:
- name: redis
  releaseName: immich-redis
  version: 20.x
  repo: oci://registry-1.docker.io/bitnamicharts
  namespace: immich
  valuesInline:
    architecture: standalone
    auth:
      enabled: false
    global:
      security:
        # Allow the upstream oliver006/redis_exporter image below.
        allowInsecureImages: true
    master:
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 50Mi
        limits:
          memory: 6Gi
          ephemeral-storage: 2Gi
    metrics:
      enabled: true
      # The chart's default bitnami/redis-exporter tag is no longer published.
      # Use the upstream exporter it wraps. It has no bash, so invoke the
      # binary directly and point it at the Redis container on localhost.
      image:
        registry: docker.io
        repository: oliver006/redis_exporter
        tag: v1.91.1
      command:
      - /redis_exporter
      extraEnvVars:
      - name: REDIS_ADDR
        value: redis://localhost:6379
      serviceMonitor:
        enabled: true
