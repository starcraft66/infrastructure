apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/namespace.yaml
- ./resources/postgres.yaml
- ./resources/volume.yaml

namespace: netbox

helmCharts:
- name: netbox
  releaseName: netbox
  version: 8.3.83
  repo: oci://ghcr.io/netbox-community/netbox-chart
  namespace: netbox
  skipTests: true
  valuesFile: ./resources/values.yaml
- name: redis
  releaseName: netbox-redis
  version: 20.x
  repo: oci://registry-1.docker.io/bitnamicharts
  namespace: netbox
  valuesInline:
    auth:
      existingSecret: "netbox"
    global:
      storageClass: "truenas-nfs-spitfire-fast"
    master:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: netbox-redis
            app.kubernetes.io/component: master
    replica:
      livenessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      readinessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: netbox-redis
            app.kubernetes.io/component: replica
