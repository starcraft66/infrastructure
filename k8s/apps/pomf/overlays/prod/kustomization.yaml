apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml
- ./resources/nfs-volume.yaml
- ./resources/pvc.yaml

namespace: pomf

images:
- name: nginx
  newTag: "alpine@sha256:1bb9390209f866c8c0bf76ba89d3f33a3f6cd6a0e6c1b457af7ee763b9579f41"

configMapGenerator:
- name: pomf-nginx-config
  files:
  - default.conf=config/default.conf