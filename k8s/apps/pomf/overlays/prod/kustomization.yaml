apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml
- ./resources/nfs-volume.yaml
- ./resources/pvc.yaml

namespace: pomf

images:
- name: nginx
  newTag: "alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606"

configMapGenerator:
- name: pomf-nginx-config
  files:
  - default.conf=config/default.conf