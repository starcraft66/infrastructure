apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml
- ./resources/nfs-volume.yaml
- ./resources/pvc.yaml

namespace: pomf

images:
- name: nginx
  newTag: "alpine@sha256:060849a174666c53439dc7cecbf8f67e225c7cbfb1a44ca97915d9a172a81e6d"

configMapGenerator:
- name: pomf-nginx-config
  files:
  - default.conf=config/default.conf