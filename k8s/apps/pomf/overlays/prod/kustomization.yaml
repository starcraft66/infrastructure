apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml
- ./resources/nfs-volume.yaml
- ./resources/pvc.yaml

namespace: pomf

images:
- name: nginx
  newTag: "alpine@sha256:b50897d5c7b1aa08067c3d90c5e8b3e47ec4e3c91c91446f67820228f7b41e34"

configMapGenerator:
- name: pomf-nginx-config
  files:
  - default.conf=config/default.conf