apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml
- ./resources/nfs-volume.yaml
- ./resources/pvc.yaml

namespace: pomf

images:
- name: nginx
  newTag: "alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72"

configMapGenerator:
- name: pomf-nginx-config
  files:
  - default.conf=config/default.conf