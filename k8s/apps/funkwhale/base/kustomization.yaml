apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/namespace.yaml
- ./resources/deployment.yaml
- ./resources/migrate-job.yaml
- ./resources/service.yaml
- ./resources/postgres.yaml
- ./resources/volume.yaml
- ./resources/pdb.yaml

namespace: redis-operator

images:
- name: funkwhale/api
  newTag: "2.0.14-legacycpu@sha256:5a86997849f7d2382bc8f421a347b023953052010c66d4c6bc198b484d178de1"
- name: funkwhale/front
  newTag: "2.0.13-legacycpu@sha256:debd95a6351c78a8406fd6e1f0e97b9dfae83004fb3fd935817e51da00a92426"

configMapGenerator:
- name: funkwhale
  literals:
  - FUNKWHALE_HOSTNAME=music.tdude.co
  - FUNKWHALE_PROTOCOL=https
  - FUNKWHALE_SPA_HTML_ROOT=http://localhost/front
  - REVERSE_PROXY_TYPE=nginx
  - MEDIA_ROOT=/srv/funkwhale/data/media
  - STATIC_ROOT=/srv/funkwhale/data/static
  - MUSIC_DIRECTORY_PATH=/srv/funkwhale/data/music
  - MUSIC_DIRECTORY_SERVE_PATH=/srv/funkwhale/data/music
  - DJANGO_SETTINGS_MODULE=config.settings.production
  - FUNKWHALE_FRONTEND_PATH=/srv/funkwhale/front/dist
  - NGINX_MAX_BODY_SIZE=500M
  - DJANGO_ALLOWED_HOSTS='*'
- name: funkwhale-front
  files:
  - ./config/nginx.conf
  - ./config/proxy.conf

helmCharts:
- name: redis
  releaseName: funkwhale-redis
  version: 28.3.12
  repo: oci://registry-1.docker.io/bitnamicharts
  namespace: funkwhale
  valuesInline:
    auth:
      existingSecret: "funkwhale"
      # The upstream exporter image has no bash to read the password file;
      # pass the password via REDIS_PASSWORD env instead.
      usePasswordFiles: false
    global:
      storageClass: "truenas-nfs-spitfire-fast"
      security:
        # Allow the upstream oliver006/redis_exporter image below.
        allowInsecureImages: true
    master:
      resourcesPreset: medium
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: funkwhale-redis
            app.kubernetes.io/component: master
    replica:
      resourcesPreset: medium
      livenessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      readinessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: funkwhale-redis
            app.kubernetes.io/component: replica
    metrics:
      enabled: true
      # Pin the upstream exporter instead of the chart's floating :latest. It
      # has no bash, so invoke the binary directly and point it at the Redis
      # container on localhost.
      image:
        registry: docker.io
        repository: oliver006/redis_exporter
        tag: v1.91.1
      command:
      - /redis_exporter
      extraEnvVars:
      - name: REDIS_ADDR
        value: redis://localhost:6379
      serviceMonitor:
        enabled: true
