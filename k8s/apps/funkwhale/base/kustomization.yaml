apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/namespace.yaml
- ./resources/deployment.yaml
- ./resources/migrate-job.yaml
- ./resources/service.yaml
- ./resources/postgres.yaml
- ./resources/volume.yaml
- ./resources/pdb.yaml

namespace: redis-operator

images:
- name: funkwhale/api
  newTag: 2.0.11-legacycpu
- name: funkwhale/front
  newTag: 2.0.11-legacycpu

configMapGenerator:
- name: funkwhale
  literals:
  - FUNKWHALE_HOSTNAME=music.tdude.co
  - FUNKWHALE_PROTOCOL=https
  - FUNKWHALE_SPA_HTML_ROOT=http://localhost/front
  - REVERSE_PROXY_TYPE=nginx
  - MEDIA_ROOT=/srv/funkwhale/data/media
  - STATIC_ROOT=/srv/funkwhale/data/static
  - MUSIC_DIRECTORY_PATH=/srv/funkwhale/data/music
  - MUSIC_DIRECTORY_SERVE_PATH=/srv/funkwhale/data/music
  - DJANGO_SETTINGS_MODULE=config.settings.production
  - FUNKWHALE_FRONTEND_PATH=/srv/funkwhale/front/dist
  - NGINX_MAX_BODY_SIZE=500M
  - DJANGO_ALLOWED_HOSTS='*'
- name: funkwhale-front
  files:
  - ./config/nginx.conf
  - ./config/proxy.conf

helmCharts:
- name: redis
  releaseName: funkwhale-redis
  version: 28.2.3
  repo: oci://registry-1.docker.io/bitnamicharts
  namespace: funkwhale
  valuesInline:
    auth:
      existingSecret: "funkwhale"
    global:
      storageClass: "truenas-nfs-spitfire-fast"
      security:
        # Allow the upstream oliver006/redis_exporter image below.
        allowInsecureImages: true
    master:
      resourcesPreset: medium
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: funkwhale-redis
            app.kubernetes.io/component: master
    replica:
      resourcesPreset: medium
      livenessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      readinessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: funkwhale-redis
            app.kubernetes.io/component: replica
    metrics:
      enabled: true
      # Pin the upstream exporter instead of the chart's floating :latest.
      image:
        registry: docker.io
        repository: oliver006/redis_exporter
        tag: v1.91.1
      serviceMonitor:
        enabled: true
