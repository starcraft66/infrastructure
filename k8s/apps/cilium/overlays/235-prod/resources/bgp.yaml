apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: default
  labels:
    pool: default
spec:
  ipv4:
    cidrs:
    - "10.234.128.0/18"
    maskSize: 24
  ipv6:
    cidrs:
    - "2a0c:9a46:636:32:2::/104"
    maskSize: 120
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  blocks:
  - cidr: "10.234.0.0/18"
  - cidr: "2a0c:9a46:636:32:3::/80"
  disabled: false
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
  - name: instance-64513
    localASN: 64513
    peers:
    - name: peer-64512-v4
      peerASN: 64512
      peerAddress: 172.16.29.1
      peerConfigRef:
        name: cilium-peer-v4
    - name: peer-64512-v6
      peerASN: 64512
      peerAddress: 2a0c:9a46:636:29::1
      peerConfigRef:
        name: cilium-peer-v6
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: cilium-peer-v4
spec:
  families:
  - afi: ipv4
    safi: unicast
    advertisements:
      matchLabels:
        advertise: "bgp"
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: cilium-peer-v6
spec:
  families:
  - afi: ipv6
    safi: unicast
    advertisements:
      matchLabels:
        advertise: "bgp"
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
  - advertisementType: "CiliumPodIPPool"
    selector:
      matchExpressions:
      # All pod IP pools
      - {key: somekey, operator: NotIn, values: ['never-used-value']}
  - advertisementType: "Service"
    service:
      addresses:
      - ClusterIP
      - ExternalIP
      - LoadBalancerIP
    selector:
      matchExpressions:
      # All services
      - {key: somekey, operator: NotIn, values: ['never-used-value']}
