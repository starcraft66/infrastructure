apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

namespace: renovate

images:
- name: renovate/renovate
  newTag: "44.239.1@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b"

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/renovate-secrets.yaml

configMapGenerator:
- name: renovate-config
  files:
  - ./config/config.json
