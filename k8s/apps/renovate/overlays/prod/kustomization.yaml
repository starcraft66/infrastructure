apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

namespace: renovate

images:
- name: renovate/renovate
  newTag: "44.252.1@sha256:a74eddc5305b4ec5597971b3b30a6b998838a3322edf928e2789ea26af4facbe"

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/renovate-secrets.yaml

configMapGenerator:
- name: renovate-config
  files:
  - ./config/config.json
