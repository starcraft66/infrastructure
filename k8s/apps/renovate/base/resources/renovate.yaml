apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: '@hourly'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              # Update this to the latest available and then enable Renovate on
              # the manifest
              image: renovate/renovate:24.53.0
              # Environment Variables
              env:
                - name: LOG_LEVEL
                  value: info
                # Skip hub.docker.com tag API (requires Bearer JWT, which Renovate
                # cannot obtain) and use the registry API with Basic PAT auth instead.
                - name: RENOVATE_X_DOCKER_HUB_TAGS_DISABLE
                  value: "true"
              envFrom:
                - secretRef:
                    name: renovate-env
              volumeMounts:
                - name: config-volume
                  mountPath: /opt/renovate/
                - name: work-volume
                  mountPath: /tmp/renovate/
          restartPolicy: Never
          volumes:
            - name: config-volume
              configMap:
                name: renovate-config
            - name: work-volume
              emptyDir: {}