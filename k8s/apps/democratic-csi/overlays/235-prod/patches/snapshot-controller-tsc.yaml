apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
  namespace: democratic-csi
spec:
  template:
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: snapshot-controller
