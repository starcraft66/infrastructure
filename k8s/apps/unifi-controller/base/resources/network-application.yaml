# Replacement for the deprecated linuxserver/unifi-controller image.
# The unifi-controller (ingress) and unifi-controller-inform (AP inform VIP)
# Services select this pod. 10.6 is the final standalone release; Network 11
# only ships in UniFi OS Server.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unifi-network-application
spec:
  serviceName: unifi-network-application
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-application
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-network-application
    spec:
      # The image's own MONGO_HOST wait gives up after a short timeout and
      # then hangs. After a node reboot the iSCSI attach can take longer.
      initContainers:
      - name: wait-for-mongo
        image: docker.io/library/mongo
        command:
        - sh
        - -c
        - until mongo --quiet --host unifi-mongo --eval 'db.adminCommand("ping").ok'; do echo waiting for unifi-mongo; sleep 5; done
      containers:
      - name: unifi-network-application
        image: lscr.io/linuxserver/unifi-network-application
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "America/Montreal"
        - name: MEM_LIMIT
          value: "1024"
        # MONGO_* are only read on first start, when /config is empty.
        - name: MONGO_HOST
          value: unifi-mongo
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DBNAME
          value: unifi
        - name: MONGO_AUTHSOURCE
          value: admin
        - name: MONGO_USER
          value: unifi
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: unifi-mongo
              key: MONGO_PASS
        ports:
        - name: "l2-discoverable"
          containerPort: 1900
          protocol: UDP
        - name: "stun"
          containerPort: 3478
          protocol: UDP
        - name: "syslog"
          containerPort: 5514
          protocol: UDP
        - name: "ap-discovery"
          containerPort: 10001
          protocol: UDP
        - name: "speed-test"
          containerPort: 6789
        - name: "internal-comms"
          containerPort: 8080
        - name: "http-web"
          containerPort: 8443
        - name: "http-s-redirect"
          containerPort: 8843
        - name: "http-redirect"
          containerPort: 8880
        volumeMounts:
        - name: config
          mountPath: /config
        # Probe the web app itself: Tomcat answers on 8080/8443 even when
        # the UniFi app failed to start (that hid the Sep 2026 outage).
        readinessProbe:
          httpGet:
            path: /status
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 20
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: unifi-network-application-config
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-network-application
  labels:
    app.kubernetes.io/name: unifi-network-application
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
  - IPv6
  - IPv4
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  selector:
    app.kubernetes.io/name: unifi-network-application
