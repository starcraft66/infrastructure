apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: unpoller
      containers:
      - name: unpoller
        image: ghcr.io/unpoller/unpoller:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: unifi-poller-config
        - secretRef:
            name: unifi-poller-secrets
        readinessProbe:
          httpGet:
            path: /
            port: metrics
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
        ports:
        - name: "metrics"
          containerPort: 9130