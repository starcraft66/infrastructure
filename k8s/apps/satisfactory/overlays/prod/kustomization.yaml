apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: satisfactory

images:
- name: "ghcr.io/wolveix/satisfactory-server"
  newName: ghcr.io/robtme/satisfactory-server
  newTag: "v1.9.11@sha256:ac252dba41653eb21c6feed94b577f98fa152f5792b1aeff2ce11fe364355137"

resources:
- ../../base
- ./resources/namespace.yaml
- ./resources/certificate.yaml
- ./resources/volume.yaml

patches:
- path: ./patches/tls-certificate-volume.yaml
  target:
    kind: StatefulSet
    name: satisfactory
- path: ./patches/tls-certificate-volume-mount.yaml
  target:
    kind: StatefulSet
    name: satisfactory
- path: ./patches/dns-svc.yaml
  target:
    kind: Service
    name: satisfactory
    version: v1

configMapGenerator:
- name: satisfactory-vars
  literals:
  - DEBUG=false
  - STEAMBETA=false
  - MAXPLAYERS=4
  - SERVERGAMEPORT=7777
  - SERVERIP="::"

labels:
- pairs:
    app.kubernetes.io/name: satisfactory
