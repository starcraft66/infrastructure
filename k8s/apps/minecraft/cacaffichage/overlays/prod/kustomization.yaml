apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cacaffichage

images:
- name: itzg/minecraft-server
  newTag: "java25@sha256:4f855c470f6bea196971e6031311130b23d8976258ad5db7e024d568fbda79f1"

resources:
- ../../../base
- ./resources/namespace.yaml
- ./resources/volume.yaml
- ./resources/ingress.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/minecraft-secrets.yaml
  - ./secrets/discordsrv-secrets.yaml

patches:
- path: ./patches/resources.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
- path: ./patches/persistence.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
- path: ./patches/env-vars.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
# Disabled for now because paper insists on writing to its config file
# - path: ./patches/server-configs.yaml
#   target:
#     group: apps
#     kind: StatefulSet
#     name: minecraft
#     version: v1
- path: ./patches/plugin-configs.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
- path: ./patches/bluemap-port.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
- path: ./patches/server-port.yaml
  target:
    group: ""
    kind: Service
    name: minecraft
    version: v1
- path: ./patches/dns-svc.yaml
  target:
    kind: Service
    name: minecraft
    version: v1
- path: ./patches/dns-srv.yaml
  target:
    group: externaldns.k8s.io
    kind: DNSEndpoint
    name: srv-record
    version: v1alpha1

configMapGenerator:
- name: minecraft-env-vars
  literals:
  - EULA=TRUE
  - TYPE=PAPER
  - VERSION=26.2
  - DIFFICULTY=hard
  - ICON=""
  - MAX_PLAYERS=20
  - MAX_WORLD_SIZE=""
  - ALLOW_NETHER=true
  - ANNOUNCE_PLAYER_ACHIEVEMENTS=true
  - ENABLE_COMMAND_BLOCK=false
  - FORCE_GAMEMODE=false
  - GENERATE_STRUCTURES=true
  - HARDCORE=false
  - MAX_BUILD_HEIGHT=256
  - MAX_TICK_TIME=60000
  - SPAWN_MONSTERS=true
  - SPAWN_NPCS=true
  - VIEW_DISTANCE=10
  - MODE=survival
  - MOTD="Welcome to Minecraft on Kubernetes!"
  - PVP=true
  - LEVEL_TYPE=DEFAULT
  - GENERATOR_SETTINGS=""
  - LEVEL=world
  - ONLINE_MODE=true
  - MEMORY=""
  - JVM_XX_OPTS="-XX:MaxRAMPercentage=85"
  - JVM_OPTS=""
  - ENABLE_RCON=true
  - SERVER_IP="::"
  # - SPIGET_RESOURCES="18494"
  # Disable programmatically pulling dynmap until solution to
  # https://github.com/itzg/docker-minecraft-server/issues/1307 is found
  # - SPIGET_RESOURCES="274,18494"
  # Supposedly this should work: https://github.com/itzg/docker-minecraft-server/issues/1378#issuecomment-1380252586
  # Spiget: DiscordSRV (18494, external->discordsrv.com), LuckPerms (28140, hosted on Spiget CDN)
  - SPIGET_RESOURCES=18494,28140
  # Modrinth: latest release compatible with VERSION + paper loader
  - MODRINTH_PROJECTS=bluemap,multiverse-core,multiverse-inventories,multiverse-netherportals
  # FallingOverride is only on CurseForge
  - MODS="https://mediafilez.forgecdn.net/files/3593/62/FallingOverride-1.18.1-1.0.jar"
- name: discordsrv-config
  files:
  - alerts.yml=files/DiscordSRV/alerts.yml
  - config.yml=files/DiscordSRV/config.yml
  - linking.yml=files/DiscordSRV/linking.yml
  - messages.yml=files/DiscordSRV/messages.yml
  - synchronization.yml=files/DiscordSRV/synchronization.yml
  - voice.yml=files/DiscordSRV/voice.yml
- name: dynmap-config
  files:
  - configuration.txt=files/dynmap/configuration.txt
- name: bstats-config
  files:
  - config.yml=files/bStats/config.yml
- name: server-config
  files:
  - paper-global.yml=files/paper/paper-global.yml

commonLabels:
  app.kubernetes.io/name: minecraft
