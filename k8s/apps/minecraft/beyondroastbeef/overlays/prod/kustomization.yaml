apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beyondroastbeef

images:
- name: itzg/minecraft-server
  newTag: "java25@sha256:7d4a888284c2f8d468f620f2534de648cb8eacba48df8d4d20b6ad1ef201f3a3"

resources:
- ../../../base
- ./resources/namespace.yaml
- ./resources/volume.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/minecraft-secrets.yaml

patches:
- path: ./patches/persistence.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
- path: ./patches/env-vars.yaml
  target:
    group: apps
    kind: StatefulSet
    name: minecraft
    version: v1
- path: ./patches/server-port.yaml
  target:
    group: ""
    kind: Service
    name: minecraft
    version: v1
- path: ./patches/dns-svc.yaml
  target:
    kind: Service
    name: minecraft
    version: v1
- path: ./patches/dns-srv.yaml
  target:
    group: externaldns.k8s.io
    kind: DNSEndpoint
    name: srv-record
    version: v1alpha1

configMapGenerator:
- name: minecraft-env-vars
  literals:
  - EULA=TRUE
  - TYPE=VANILLA
  # renovate: datasource=custom.mojang depName=vanilla
  - VERSION=26.3
  - DIFFICULTY=hard
  - ICON=""
  - MAX_PLAYERS=20
  - MAX_WORLD_SIZE=""
  - ALLOW_NETHER=true
  - ANNOUNCE_PLAYER_ACHIEVEMENTS=true
  - ENABLE_COMMAND_BLOCK=false
  - FORCE_GAMEMODE=false
  - GENERATE_STRUCTURES=true
  - HARDCORE=false
  - MAX_BUILD_HEIGHT=256
  - MAX_TICK_TIME=60000
  - SPAWN_MONSTERS=true
  - SPAWN_NPCS=true
  - SPAWN_PROTECTION=0
  - VIEW_DISTANCE=10
  - MODE=survival
  - MOTD="Beyond Roast Beef"
  - PVP=true
  - LEVEL_TYPE=DEFAULT
  - GENERATOR_SETTINGS=""
  - LEVEL=world
  - ONLINE_MODE=true
  - MEMORY=8192M
  - JVM_OPTS=""
  - JVM_XX_OPTS=""
  - ENABLE_RCON=true
  - SERVER_IP="::"

commonLabels:
  app.kubernetes.io/name: minecraft
