apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/namespace.yaml
- ./resources/deployment.yaml
- ./resources/tika.yaml
- ./resources/gotenberg.yaml
- ./resources/postgres.yaml
- ./resources/service.yaml
# - ./resources/servicemonitor.yaml
- ./resources/volume.yaml
- ./resources/pdb.yaml

images:
- name: ghcr.io/paperless-ngx/paperless-ngx
  # Don't upgrade to 2.15.3 until the following issue is resolved:
  # https://github.com/just-containers/s6-overlay/issues/600
  newTag: "3.2.1"
- name: "gotenberg/gotenberg"
  newTag: "8.37.0"
- name: "apache/tika"
  newTag: "3.3.1.0"

namespace: paperless-ngx

helmCharts:
- name: redis
  releaseName: paperless-ngx-redis
  version: 20.x
  repo: oci://registry-1.docker.io/bitnamicharts
  namespace: paperless-ngx
  valuesInline:
    auth:
      existingSecret: "paperless-ngx-redis"
      # The upstream exporter image has no bash to read the password file;
      # pass the password via REDIS_PASSWORD env instead.
      usePasswordFiles: false
    global:
      storageClass: "truenas-nfs-spitfire-fast"
      security:
        # Allow the upstream oliver006/redis_exporter image below.
        allowInsecureImages: true
    master:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: paperless-ngx-redis
            app.kubernetes.io/component: master
    replica:
      livenessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      readinessProbe:
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: paperless-ngx-redis
            app.kubernetes.io/component: replica
    metrics:
      enabled: true
      # The chart's default bitnami/redis-exporter tag is no longer published.
      # Use the upstream exporter it wraps. It has no bash, so invoke the
      # binary directly and point it at the Redis container on localhost.
      image:
        registry: docker.io
        repository: oliver006/redis_exporter
        tag: v1.91.1
      command:
      - /redis_exporter
      extraEnvVars:
      - name: REDIS_ADDR
        value: redis://localhost:6379
      serviceMonitor:
        enabled: true
