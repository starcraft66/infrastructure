apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud

images:
- name: library/nextcloud
  newTag: "35.0-apache"

resources:
- ../../base
- ./resources/namespace.yaml
- ./resources/database.yaml
- ./resources/ingress.yaml
- ./resources/nfs-volume.yaml
- ./resources/volume.yaml
- ./resources/cron-files-scan.yaml
- ./resources/cron-generate-previews.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/nextcloud-secrets.yaml
  - ./secrets/postgres-credentials.yaml

configMapGenerator:
- name: nextcloud-env-vars
  literals:
  - NEXTCLOUD_TRUSTED_DOMAINS="cloud.tdude.co cloud4.tdude.co"
  - NEXTCLOUD_DATA_DIR="/var/www/html/data"
  - POSTGRES_HOST=nextcloud-postgres-rw
  - POSTGRES_DB=nextcloud
  - POSTGRES_USER=nextcloud
  - NC_maintenance_window_start=1
  - NC_default_phone_region=CA
  - NC_mail_smtpmode=null
  - OVERWRITEPROTOCOL=https
  - TRUSTED_PROXIES=10.234.128.0/22 2a10:4741:36:32:2::/112

patchesStrategicMerge:
- ./patches/remove-redis-env.yaml

commonLabels:
  app.kubernetes.io/name: nextcloud
