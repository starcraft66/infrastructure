---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: photoprism-db
  labels:
    app.kubernetes.io/name: photoprism
spec:
  # Official MariaDB image, required by mariadb-operator.
  # Tracking the release candidate to match the version the Bitnami chart was
  # running (upstream has no stable 13.1 yet). Move to a stable 13.x once GA.
  image: mariadb:13.1.1-rc
  replicas: 1
  rootPasswordSecretKeyRef:
    name: mariadb-secrets
    key: mariadb-root-password
  # PhotoPrism's recommended dedicated database user (ALL PRIVILEGES on its schema).
  username: photoprism
  passwordSecretKeyRef:
    name: mariadb-secrets
    key: mariadb-password
  database: photoprism
  myCnf: |
    innodb_buffer_pool_size=2G
    character-set-server=utf8
    collation-server=utf8_general_ci
  storage:
    size: 15Gi
    storageClassName: truenas-iscsi-spitfire-fast
  metrics:
    enabled: true
  # One-time logical restore of the dump in `photoprism-db-bootstrap` (file must be
  # named backup.<RFC3339>.sql). Used on initial creation / disaster recovery.
  # Backups themselves are handled by TrueNAS ZFS snapshots, so no Backup CR here.
  bootstrapFrom:
    volume:
      persistentVolumeClaim:
        claimName: photoprism-db-bootstrap
