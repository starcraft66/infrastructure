apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

namespace: attention-attention

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/discord-token.yaml

images:
- name: ghcr.io/starcraft66/attention-attention/attention-attention
  newTag: "v1.0.3-x86_64@sha256:a3c312959fdcfe589b0009fb4049432ae67ba59238bd9f387a77e7e3196eaeea"
