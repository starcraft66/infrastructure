apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../305-1700-base
- ./resources/monitoring-rbac.yaml
- ./resources/project.yaml
- ./resources/applications.yaml
- ./resources/ingress.yaml

namespace: argocd

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/deploy-pgp-key.yaml
  - ./secrets/argocd-secret-patch.yaml

images:
- name: argoprojlabs/argocd-image-updater
  newTag: "latest@sha256:5176770f8a5c7267032115f8fbb9db653b8f86264744ae401dd57d3a61d47f97"

patches:
- path: ./patches/argocd-cm-patch.yaml
