apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-redis-ha-server
spec:
  template:
    spec:
      # Replace the upstream hard hostname pod anti-affinity with a soft topology
      # spread constraint so redis/sentinel pods can be evicted and rescheduled
      # during node drains, and rebalanced by the descheduler afterwards.
      affinity: null
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-redis-ha
