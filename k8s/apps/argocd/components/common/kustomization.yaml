apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared by every cluster overlay. The upstream ArgoCD manifest (HA or
# single-node) is supplied by the overlay itself, so this component only carries
# the patches and resources that are common to all variants.
resources:
# I don't use Dex at the moment and it doesn't seem to produce metrics
# when unconfigured.
# - ./metrics/argocd-dex-server-serviceMonitor.yaml
- ./metrics/argocd-serviceMonitor.yaml
- ./metrics/argocd-server-serviceMonitor.yaml
- ./metrics/argocd-repo-server-serviceMonitor.yaml
- ./namespace.yaml
- ./resources/pdbs.yaml

patches:
- path: ./patches/argocd-cm-patch.yaml
- path: ./patches/argocd-gpg-keys-cm-patch.yaml
- path: ./patches/argo-cd-repo-server-ksops-patch.yaml
- path: ./patches/argo-cd-import-pgp-key.yaml

configMapGenerator:
- name: argocd-rbac-cm
  behavior: merge
  literals:
  - policy.default="role:readonly"
  - scopes="[groups, email]"
  files:
  - policy.csv=files/policy.csv

generatorOptions:
  disableNameSuffixHash: true

images:
- name: viaductoss/ksops
  newTag: "v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334"
