apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Multi-node cluster: use the HA upstream manifest, which runs redis in sentinel
# mode with a haproxy frontend and sharded application controllers.
- https://github.com/argoproj/argo-cd/manifests/ha/cluster-install?ref=v3.5.3

components:
- ../components/common
- ../components/ha

# The namespace transformer has to live here (and not in the overlay) so that
# the overlay's ksops secret generator can merge into the already-namespaced
# upstream secrets.
namespace: argocd
