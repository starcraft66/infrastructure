# Replace (not 3-way-apply) so the stale last-applied-configuration, which still
# carries the old duplicate env names, cannot make the apply drop entries.
- op: add
  path: "/metadata/annotations"
  value:
    argocd.argoproj.io/sync-options: "Replace=true"
# Chart zigbee2mqtt 16.14.0 renders empty ZIGBEE2MQTT_CONFIG_MQTT_USER/_PASSWORD
# (container) and SERIAL_PORT (init container) defaults. Replace them in place by
# index so the env list keeps its order and has no duplicate names. The `test` ops
# fail the build if the chart's env layout changes, instead of silently corrupting it.
- op: test
  path: /spec/template/spec/containers/0/env/14/name
  value: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
- op: replace
  path: /spec/template/spec/containers/0/env/14
  value:
    name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mosquitto-creds
        key: password
- op: test
  path: /spec/template/spec/containers/0/env/16/name
  value: ZIGBEE2MQTT_CONFIG_MQTT_USER
- op: replace
  path: /spec/template/spec/containers/0/env/16
  value:
    name: ZIGBEE2MQTT_CONFIG_MQTT_USER
    valueFrom:
      secretKeyRef:
        name: mosquitto-creds
        key: username
- op: test
  path: /spec/template/spec/initContainers/0/env/14/name
  value: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
- op: replace
  path: /spec/template/spec/initContainers/0/env/14
  value:
    name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mosquitto-creds
        key: password
- op: test
  path: /spec/template/spec/initContainers/0/env/16/name
  value: ZIGBEE2MQTT_CONFIG_MQTT_USER
- op: replace
  path: /spec/template/spec/initContainers/0/env/16
  value:
    name: ZIGBEE2MQTT_CONFIG_MQTT_USER
    valueFrom:
      secretKeyRef:
        name: mosquitto-creds
        key: username
- op: test
  path: /spec/template/spec/initContainers/0/env/19/name
  value: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
- op: replace
  path: /spec/template/spec/initContainers/0/env/19
  value:
    name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
    value: "/dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2234262-if00"
