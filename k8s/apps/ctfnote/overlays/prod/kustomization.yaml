apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

namespace: ctfnote

images:
- name: starcraft66/ctfnote
  newTag: "latest@sha256:8c5f98307dbe4c4c0fac016b1d7edb91a7740b3e05b6417866614356f69bd5cb"
- name: ghcr.io/starcraft66/ctfnote-frontend
  newTag: "big-uploads@sha256:516416e93dbe216cdfbe7ec9654c571a25a1f5dd7d02bf580bbebb0c85da2c83"
- name: quay.io/hedgedoc/hedgedoc:1.9.0-alpine
  newTag: "1.12.0-alpine"

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/postgres-credentials.yaml
  - ./secrets/ctfnote-secrets.yaml

configMapGenerator:
- name: ctfnote-api-config
  literals:
  - PAD_CREATE_URL=http://hedgedoc:3000/new
  - PAD_SHOW_URL=/
  - DB_DATABASE=ctfnote
  - DB_HOST=postgres-ctfnote-rw
  - DB_PORT=5432
  - WEB_PORT=3000
- name: hedgedoc-config
  literals:
  - CMD_DB_URL=postgres://ctfnote:ctfnote@postgres-ctfnote-rw:5432/hedgedoc
  - CMD_URL_PATH=pad
  - CMD_DOMAIN=ctfnote.tdude.co
  - CMD_PROTOCOL_USESSL=true
  - CMD_CSP_ENABLE=true
  - CMD_IMAGE_UPLOAD_TYPE=filesystem
