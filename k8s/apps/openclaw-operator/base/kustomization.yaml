apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./resources/namespace.yaml

namespace: openclaw-operator

helmCharts:
- name: openclaw-operator
  releaseName: openclaw-operator
  version: 0.40.0
  repo: oci://ghcr.io/paperclipinc/charts
  namespace: openclaw-operator
  includeCRDs: true
  valuesFile: ./resources/values.yaml

patches:
- target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: ClusterRole
    name: openclaw-operator-manager-role
  patch: |-
    - op: add
      path: /rules/-
      value:
        apiGroups:
        - authentication.k8s.io
        resources:
        - tokenreviews
        verbs:
        - create
    - op: add
      path: /rules/-
      value:
        apiGroups:
        - authorization.k8s.io
        resources:
        - subjectaccessreviews
        verbs:
        - create
