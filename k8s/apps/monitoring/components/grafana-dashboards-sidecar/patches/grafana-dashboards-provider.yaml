apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |-
    {
        "apiVersion": 1,
        "providers": [
            {
                "folder": "Default",
                "folderUid": "",
                "name": "0",
                "options": {
                    "path": "/grafana-dashboard-definitions/0"
                },
                "orgId": 1,
                "type": "file"
            },
            {
                "allowUiUpdates": false,
                "disableDeletion": false,
                "name": "sidecar",
                "options": {
                    "foldersFromFilesStructure": true,
                    "path": "/tmp/dashboards"
                },
                "orgId": 1,
                "type": "file",
                "updateIntervalSeconds": 10
            }
        ]
    }
