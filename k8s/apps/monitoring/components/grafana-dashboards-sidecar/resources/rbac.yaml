---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-dashboards-sidecar
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-dashboards-sidecar
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-dashboards-sidecar
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-dashboards-sidecar
subjects:
- kind: ServiceAccount
  name: grafana-dashboards-sidecar
  namespace: monitoring
