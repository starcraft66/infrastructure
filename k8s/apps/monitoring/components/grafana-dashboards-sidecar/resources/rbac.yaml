---
# The sidecar runs in the Grafana pod, which uses the `grafana` ServiceAccount.
# RBAC is therefore bound to that SA rather than a dedicated one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-dashboards-sidecar
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-dashboards-sidecar
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-dashboards-sidecar
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: monitoring
