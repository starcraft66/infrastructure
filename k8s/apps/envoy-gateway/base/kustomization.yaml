apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/namespace.yaml
- ./resources/gateway.yaml
- ./resources/dummy-http.yaml

namespace: envoy-gateway

images:
- name: hashicorp/http-echo
  newTag: "latest@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186"

helmCharts:
- name: gateway-crds-helm
  releaseName: envoy-gateway-crds
  valuesFile: ./resources/envoy-gateway-crds-values.yaml
  version: v1.9.3
  repo: oci://registry-1.docker.io/envoyproxy
  namespace: envoy-gateway
  includeCRDs: true

- name: gateway-helm
  releaseName: envoy-gateway
  valuesFile: ./resources/envoy-gateway-values.yaml
  version: v1.9.2
  repo: oci://registry-1.docker.io/envoyproxy
  namespace: envoy-gateway
  includeCRDs: true
