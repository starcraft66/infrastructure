apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./resources/cronjob.yaml
- ./resources/namespace.yaml
- ./resources/volume.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: secret-generator
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secrets/cloudflare-token.yaml
  - ./secrets/soarin-secrets.yaml
  - ./secrets/fleetfoot-secrets.yaml
  - ./secrets/stormfeather-secrets.yaml
  - ./secrets/sassaflash-secrets.yaml
  - ./secrets/firestreak-secrets.yaml
  - ./secrets/spitfire-secrets.yaml

images:
- name: starcraft66/hpilo-letsencrypt
  newTag: "latest@sha256:f3b92bceff74a1ac9d7bd4aa1936a10080cfd650fe22d1dceb2e2d704fd0344f"
- name: starcraft66/supermicro-letsencrypt
  newTag: "latest@sha256:bb03bc589b0a268778ddd6071d2af77f584bc6d8ff352766e79364a1df3839c4"

configMapGenerator:
- name: soarin-config
  literals:
  - ILO_USERNAME=Administrator
  - ILO_DOMAIN=soarin-ilo.235.tdude.co
- name: fleetfoot-config
  literals:
  - ILO_USERNAME=Administrator
  - ILO_DOMAIN=fleetfoot-ilo.235.tdude.co
- name: stormfeather-config
  literals:
  - ILO_USERNAME=Administrator
  - ILO_DOMAIN=stormfeather-ilo.235.tdude.co
- name: sassaflash-config
  literals:
  - ILO_USERNAME=Administrator
  - ILO_DOMAIN=sassaflash-ilo.235.tdude.co
- name: firestreak-config
  literals:
  - IPMI_USERNAME=ADMIN
  - IPMI_DOMAIN=firestreak-bmc.235.tdude.co
- name: spitfire-config
  literals:
  - IPMI_USERNAME=ADMIN
  - IPMI_DOMAIN=spitfire-bmc.235.tdude.co

namespace: letsencrypt-cron
