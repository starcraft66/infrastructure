apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

namespace: external-dns

images:
- name: registry.k8s.io/external-dns/external-dns
  # My fork with SRV records fixed for cloudflare
  newName: docker.io/starcraft66/external-dns
  newTag: "srv-fix-v9@sha256:fcc7e58e7bc53da891c27887bb50f4ac04383a0f6d65c44134f3793f3168762f"

patches:
- path: ./patches/dns-ownership.yaml
  target:
    group: apps
    kind: Deployment
    name: external-dns
    version: v1
