apiVersion: apps/v1
kind: Deployment
metadata:
  name: koreader-sync
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: koreader-sync
  replicas: 1
  # Redis runs inside the container with its data on a RWO volume, so only
  # one pod may run at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: koreader-sync
    spec:
      containers:
      - name: koreader-sync
        image: koreader/kosync:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: koreader-sync-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
        ports:
        # 7200 serves HTTPS with a self-signed cert; 17200 is plain HTTP
        # intended for TLS-terminating reverse proxies.
        - name: http
          containerPort: 17200
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: http
            httpHeaders:
            - name: Accept
              value: application/vnd.koreader.v1+json
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: http
            httpHeaders:
            - name: Accept
              value: application/vnd.koreader.v1+json
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
        volumeMounts:
        - name: redis-data
          mountPath: /var/lib/redis
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: koreader-sync-redis
