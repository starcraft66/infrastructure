apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml

namespace: koreader-sync

images:
- name: koreader/kosync
  newTag: "v2.1.1@sha256:bb3f13615365703315a43b9059f65e71e876440f867e23a42bf27f2fa18264e1"

configMapGenerator:
- name: koreader-sync-config
  literals:
  # Set to "false" once accounts for all devices have been registered.
  - ENABLE_USER_REGISTRATION=true
  - TZ=America/Toronto
