apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../helmbase
- ./resources/service.yaml
- ./resources/middleware.yaml
- ./resources/monitoring-rbac.yaml

namespace: traefik

images:
- name: quay.io/oauth2-proxy/oauth2-proxy
  newTag: "v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916"

patches:
- path: ./patches/traefik-config-file.yaml
- path: ./patches/remove-helm-defaults.yaml
  target:
    group: apps
    kind: Deployment
    name: traefik
    namespace: traefik
    version: v1

configMapGenerator:
- name: traefik-config
  namespace: traefik
  files:
  - traefik.toml=configs/traefik.toml
