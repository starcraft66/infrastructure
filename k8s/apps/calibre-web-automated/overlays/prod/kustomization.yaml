apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./resources/ingress.yaml

namespace: calibre-web-automated

images:
- name: crocodilestick/calibre-web-automated
  newTag: "v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679"

configMapGenerator:
- name: calibre-web-automated-config
  literals:
  - PUID=1000
  - PGID=1000
  - TZ=America/Toronto
  # The ingest volume is NFS, where inotify events are unreliable.
  - CWA_WATCH_MODE=poll
