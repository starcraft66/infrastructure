---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: calibre-web-automated
  name: calibre-web-automated
spec:
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
  - IPv6
  - IPv4
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: calibre-web-automated
  type: ClusterIP
