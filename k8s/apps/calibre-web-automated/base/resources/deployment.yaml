apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web-automated
  replicas: 1
  # Config and library are RWO volumes holding SQLite databases; only one pod
  # may run at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web-automated
    spec:
      containers:
      - name: calibre-web-automated
        image: crocodilestick/calibre-web-automated:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: calibre-web-automated-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        # First boot runs s6 init, library setup and chowns; give it time.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: config
          mountPath: /config
        - name: library
          mountPath: /calibre-library
        - name: ingest
          mountPath: /cwa-book-ingest
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: calibre-web-automated-config
      - name: library
        persistentVolumeClaim:
          claimName: calibre-web-automated-library
      - name: ingest
        persistentVolumeClaim:
          claimName: calibre-web-automated-ingest
